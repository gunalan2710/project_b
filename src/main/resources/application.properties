# OpenCV Configuration
# Windows path (for local development)
# opencv.native.lib.path=C:/opencv/opencv/build/java/x64/opencv_java490.dll

# Linux/Docker path (will be used in production)
opencv.native.lib.path=/usr/lib/jni/libopencv_java490.so
opencv.required=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# Logging Configuration
logging.level.ai.simplfin.doczbot=DEBUG
logging.level.org.springframework=INFO
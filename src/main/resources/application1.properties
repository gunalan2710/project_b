	# ====================================================================
	# Application Identity
	# ====================================================================
	spring.application.name=doczbot
	
	# ====================================================================
	# Server Configuration
	# ====================================================================
	server.port=8080
	server.servlet.context-path=/
	
	# ====================================================================
	# Multipart File Upload
	# ====================================================================
	spring.servlet.multipart.enabled=true
	spring.servlet.multipart.max-file-size=10MB
	spring.servlet.multipart.max-request-size=10MB
	spring.servlet.multipart.location=${java.io.tmpdir}
	
	# ====================================================================
	# Jackson Configuration
	# ====================================================================
	spring.jackson.property-naming-strategy=SNAKE_CASE
	spring.jackson.default-property-inclusion=NON_NULL
	spring.jackson.serialization.write-dates-as-timestamps=false
	spring.jackson.serialization.indent-output=true
	
	# ====================================================================
	# Tesseract OCR Configuration (default)
	# ====================================================================
	tesseract.language=eng
	tesseract.data.path=C:/Program Files/Tesseract-OCR/tessdata
	
	# ====================================================================
	# Llama Vision AI Configuration (default disabled)
	# ====================================================================
	llama.vision.enabled=false
	llama.vision.api.url=http://localhost:11434/api/generate
	llama.vision.model=llava:latest
	llama.vision.timeout=60
	
	# ====================================================================
	# Application Configuration
	# ====================================================================
	app.temp.directory=${java.io.tmpdir}/document-extractor
	app.cleanup.enabled=true
	
	# ====================================================================
	# Logging Configuration
	# ====================================================================
	logging.level.ai.simplfin.doczbot=INFO
	logging.level.org.apache.tika=WARN
	logging.level.org.apache.pdfbox=WARN
	logging.level.net.sourceforge.tess4j=WARN
	logging.level.org.springframework.ai=INFO
	
	logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
	logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
	
	logging.file.name=logs/document-extractor.log
	logging.logback.rollingpolicy.max-file-size=10MB
	logging.logback.rollingpolicy.max-history=5
	
	# ====================================================================
	# Management Endpoints
	# ====================================================================
	management.endpoints.web.exposure.include=health,info,metrics
	management.endpoint.health.show-details=when-authorized
	
	# ====================================================================
	# Application Info
	# ====================================================================
	info.app.name=Document Text Extractor API
	info.app.description=AI-powered document text extraction with OCR support
	info.app.version=1.0.0
	info.app.author=SimplFin AI
	info.app.contact=support@simplfin.ai
